name: Verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: normlanguage/registry/.github/actions/setup-norm@d229852448570c786a3f86e62c7db36769ed9a18
        with:
          source-ref: 6448d308a011bb8a2d892b4f69f6f7b4891e111b
      - name: Build and check
        run: |
          ./scripts/build.ps1 -JavaHome $env:JAVA_HOME_21_X64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/norm.ps1 check ui/theme
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- ui/theme/module.norm
      - name: Color kernel references
        run: |
          & "$env:JAVA_HOME_21_X64/bin/javac.exe" --release 21 -cp build/classes -d build/test-classes src/test/java/dev/normlanguage/theme/ColorMathTest.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME_21_X64/bin/java.exe" -cp 'build/classes;build/test-classes' dev.normlanguage.theme.ColorMathTest
      - name: Theme contracts
        run: ./scripts/norm.ps1 test ui/theme
      - id: package
        uses: normlanguage/registry/.github/actions/package-module@1c5b2948a0c788f1aa21542255eb1a445027ab29
        with:
          module-path: ui/theme
          norm-executable: ./scripts/norm.ps1
          cache-directory: .norm-home/.norm/cache/packages/github
      - name: Archive consumer and desktop acceptance
        run: |
          ./scripts/desktop.ps1 -Verify -JavaHome $env:JAVA_HOME_21_X64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/norm.ps1 run samples/basic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- ui/theme/module.norm samples/desktop/module.norm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-theme-candidate
          path: |
            build/repository
            build/desktop-preview.png
      - uses: normlanguage/registry/.github/actions/publish-module@1c5b2948a0c788f1aa21542255eb1a445027ab29
        with:
          archive: ${{ steps.package.outputs.archive }}
          version: ${{ steps.package.outputs.version }}
